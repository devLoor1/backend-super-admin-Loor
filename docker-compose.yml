services:
  mysql:
    image: mysql:8.0
    container_name: loor-super-admin-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loor_super_admin
      MYSQL_USER: super_admin
      MYSQL_PASSWORD: super_admin
    volumes:
      - loor_super_admin_mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  loor_super_admin_mysql_data:
